<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f4ed">
  <meta name="description" content="從零開始學習聖經希伯來文：字母、發音、跟讀與小測驗。">
  <title>聖經希伯來文｜junlee.cc</title>
  <style>
    :root{--ink:#182b36;--muted:#63727a;--paper:#f7f4ed;--card:#fffefa;--line:#e7e3d9;--teal:#176b66;--teal2:#e7f2ee;--gold:#dbad54;--rose:#f6e9e4;--shadow:0 18px 50px #283b3610}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 system-ui,-apple-system,"Noto Sans TC",sans-serif}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #d4a443;outline-offset:3px}.shell{max-width:1120px;margin:auto;padding:28px 24px 72px}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:36px}.brand{font-size:14px;font-weight:750;letter-spacing:.08em}.brand small{display:block;color:var(--muted);font-weight:500;letter-spacing:0}.tag{color:var(--teal);background:var(--teal2);padding:7px 13px;border-radius:99px;font-size:13px;font-weight:700}.hero{display:grid;grid-template-columns:1.35fr .65fr;gap:40px;align-items:center;margin:24px 0 38px}.eyebrow{color:var(--teal);font-size:13px;font-weight:800;letter-spacing:.12em}.hero h1{font-size:clamp(36px,6vw,62px);line-height:1.12;letter-spacing:-.045em;margin:12px 0 16px}.hero p{color:var(--muted);max-width:610px;margin:0}.hero-art{height:230px;border-radius:28px;background:radial-gradient(circle at 70% 25%,#f3dbab 0 8%,transparent 8.5%),linear-gradient(145deg,#e7f2ee,#f5e8d0);display:grid;place-items:center;position:relative;overflow:hidden}.hero-art:before,.hero-art:after{content:"";position:absolute;width:220px;height:220px;border:1px solid #176b662a;border-radius:50%}.hero-art:after{width:285px;height:285px}.hero-hebrew{font:76px/1.2 "Times New Roman",serif;color:var(--teal);z-index:1;direction:rtl}.dashboard{display:grid;grid-template-columns:250px 1fr;gap:24px;align-items:start}.side,.panel,.progress-card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.side{padding:18px;position:sticky;top:18px}.side h2{font-size:13px;color:var(--muted);margin:0 0 12px 8px}.lesson-link{display:flex;width:100%;text-align:left;align-items:center;gap:12px;padding:11px 10px;border:0;background:transparent;border-radius:12px;color:var(--ink)}.lesson-link:hover,.lesson-link.active{background:var(--teal2)}.lesson-link.active{color:var(--teal);font-weight:750}.lesson-num{display:grid;place-items:center;width:31px;height:31px;border-radius:10px;background:#f0eee7;font-size:12px}.lesson-link.active .lesson-num{background:white}.side-note{border-top:1px solid var(--line);margin-top:14px;padding:15px 8px 0;color:var(--muted);font-size:12px}.progress-card{padding:16px;margin-top:15px}.progress-head{display:flex;justify-content:space-between;font-size:13px;font-weight:700}.bar{height:7px;background:#eeeae0;border-radius:9px;margin:11px 0 8px;overflow:hidden}.bar span{height:100%;display:block;background:var(--teal);border-radius:9px;transition:width .3s}.progress-card small{color:var(--muted)}.content{min-width:0}.panel{padding:clamp(22px,4vw,38px)}.lesson-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;padding-bottom:22px;border-bottom:1px solid var(--line)}.lesson-head h2{font-size:26px;margin:3px 0 5px}.lesson-head p{color:var(--muted);margin:0}.kicker{color:var(--teal);font-size:12px;font-weight:800;letter-spacing:.08em}.mark{border:1px solid var(--line);background:white;color:var(--muted);border-radius:99px;padding:8px 14px;white-space:nowrap}.mark.done{background:var(--teal2);border-color:var(--teal2);color:var(--teal)}.intro{margin:22px 0;color:#465861}.letter-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.letter{border:1px solid var(--line);border-radius:16px;background:white;padding:15px 12px;text-align:center;min-width:0}.glyph{font:48px/1.2 "Times New Roman",serif;direction:rtl;color:var(--teal);margin:4px 0}.name{font-weight:750}.sound{font-size:13px;color:var(--muted)}.hear{border:0;background:var(--teal2);color:var(--teal);font-size:13px;font-weight:700;padding:7px 11px;border-radius:9px;margin-top:11px}.hear:hover{background:#d5e9e2}.note-box{display:flex;gap:13px;background:#f4f2eb;border-radius:14px;padding:15px 17px;margin:21px 0;color:#475961;font-size:14px}.note-icon{font-size:20px}.section-title{font-size:18px;margin:28px 0 12px}.exercise{border:1px solid var(--line);border-radius:15px;padding:18px;background:#fff;margin-top:12px}.exercise p{margin:0 0 12px;font-weight:700}.answers{display:flex;flex-wrap:wrap;gap:9px}.answer{border:1px solid var(--line);background:white;border-radius:10px;padding:8px 15px}.answer:hover{border-color:var(--teal);color:var(--teal)}.answer.correct{background:var(--teal2);border-color:var(--teal);color:var(--teal)}.answer.wrong{background:var(--rose);border-color:#d7a095;color:#8b4038}.feedback{min-height:24px;margin-top:10px;color:var(--muted);font-size:14px}.lesson-foot{display:flex;justify-content:space-between;align-items:center;margin-top:25px;gap:12px}.primary,.secondary{border:0;border-radius:12px;padding:11px 18px;font-weight:750}.primary{background:var(--teal);color:white}.primary:hover{background:#105a56}.secondary{background:#f0eee7;color:var(--ink)}.lesson-foot small{color:var(--muted)}.footer{color:var(--muted);font-size:12px;text-align:center;margin-top:28px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#18323a;color:white;padding:11px 17px;border-radius:12px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}
    @media(max-width:760px){.shell{padding:20px 16px 48px}.topbar{margin-bottom:24px}.hero{grid-template-columns:1fr;gap:20px;margin:10px 0 25px}.hero-art{height:150px}.hero-hebrew{font-size:58px}.dashboard{grid-template-columns:1fr}.side{position:static;padding:14px}.side nav{display:flex;overflow:auto;gap:5px}.side h2,.side-note,.progress-card{display:none}.lesson-link{width:auto;white-space:nowrap}.lesson-link span:last-child{display:none}.letter-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.letter:last-child{grid-column:span 2}.lesson-head{align-items:flex-start}.lesson-head h2{font-size:21px}.mark{font-size:12px;padding:7px 10px}.panel{padding:20px}.lesson-foot{align-items:flex-start;flex-wrap:wrap}.lesson-foot small{order:3;width:100%}}
  </style>
</head>
<body>
<div class="shell">
  <header class="topbar"><div class="brand">JUNLEE.CC <small>個人學習空間</small></div><div class="tag">聖經希伯來文・零基礎</div></header>
  <section class="hero"><div><div class="eyebrow">BIBLICAL HEBREW · BEGINNER</div><h1>從字母開始，<br>讀懂希伯來文。</h1><p>循序認識聖經希伯來文字母、練習發音與跟讀，再用短測驗鞏固記憶。每次學一小步，進度會保存在這台裝置上。</p></div><div class="hero-art" aria-hidden="true"><div class="hero-hebrew">בְּרֵאשִׁית</div></div></section>
  <main class="dashboard"><aside><div class="side"><h2>課程</h2><nav id="lessonNav" aria-label="課程列表"></nav><div class="side-note">建議每天練習 5–10 分鐘。按喇叭聽發音，再跟著念一次。</div></div><div class="progress-card"><div class="progress-head"><span>學習進度</span><span id="progressText">0 / 4</span></div><div class="bar"><span id="progressBar" style="width:0%"></span></div><small id="progressHint">完成一課，開始累積進度</small></div></aside>
  <section class="content"><article class="panel" id="lessonPanel" aria-live="polite"></article></section></main>
  <footer class="footer">發音使用裝置內建語音功能；實際可用的希伯來文語音依瀏覽器與裝置而異。學習進度僅儲存在此瀏覽器。</footer>
</div><div class="toast" id="toast" role="status"></div>
<script>
const lessons=[
 {title:'認識第一組字母',sub:'字母與子音發音',intro:'先認識五個常見字母。點選「聽發音」聽字母名稱，再練習它代表的子音。Aleph 的功能與一般子音不同，初學時先記住它的名稱即可。',letters:[['א','Aleph','字母名稱：AH-lef','Aleph'],['בּ','Bet','/b/ · boy','Bet'],['ב','Vet','/v/ · very','Vet'],['ג','Gimel','/g/ · go','Gimel'],['ד','Dalet','/d/ · dog','Dalet']],quiz:{q:'哪個字母通常代表 /h/ 的氣音？',choices:['א Aleph','ד Dalet','ה He'],correct:2},note:'בּ 有點號時通常讀作 /b/（Bet）；沒有點號時常讀作 /v/（Vet）。點號稱為 Dagesh。'},
 {title:'認識第二組字母',sub:'辨認相似的字形',intro:'把字母的外形和名稱連在一起。希伯來文從右向左讀；這裡先練習辨認，不必急著拼讀單字。',letters:[['ו','Vav','/v/ · vine','Vav'],['ז','Zayin','/z/ · zoo','Zayin'],['ח','Chet','喉部摩擦音','Chet'],['ט','Tet','/t/ · top','Tet'],['י','Yod','/y/ · yes','Yod']],quiz:{q:'哪個字母名稱是 Yod？',choices:['י','ו','ז'],correct:0},note:'ח（Chet）是喉部摩擦音，中文沒有完全相同的音。先聽示範並輕柔練習，不要勉強喉嚨。'},
 {title:'字母的不同形式',sub:'認識五個詞尾字母',intro:'五個希伯來字母在詞尾有特別寫法。字母名稱與基本音值大致相同，閱讀時留意它們出現在詞尾的位置。',letters:[['ך','Final Kaf','/k/ · 詞尾','Final Kaf'],['ם','Final Mem','/m/ · 詞尾','Final Mem'],['ן','Final Nun','/n/ · 詞尾','Final Nun'],['ף','Final Pe','/f/ · 詞尾','Final Pe'],['ץ','Final Tsadi','/ts/ · 詞尾','Final Tsadi']],quiz:{q:'哪一個是 Mem 的詞尾形式？',choices:['ם','ן','ך'],correct:0},note:'詞尾字母只會出現在詞的最後。之後看到 ם ן ך ף ץ，不要把它們當成新字母。'},
 {title:'母音與第一個詞',sub:'讀出 בְּרֵאשִׁית',intro:'母音符號寫在子音周圍或下方，幫助我們讀出音節。練習創世記 1:1 的第一個詞：בְּרֵאשִׁית，意思是「起初」。',letters:[['בְּ','be','短音 · beh','be'],['רֵ','re','長音 · reh','re'],['א','Aleph','此處承接音節','Aleph'],['שִׁ','shi','sh + i','shi'],['ת','Tav','/t/ · t','Tav']],quiz:{q:'בְּרֵאשִׁית 的意思是什麼？',choices:['起初','平安','大地'],correct:0},note:'跟讀提示：be-re-shit，慢慢分成音節再連起來。重音常落在最後音節。讀希伯來文字時由右向左看。'}
];
let state={current:0,done:JSON.parse(localStorage.getItem('hebrewDone')||'[]')};
const nav=document.getElementById('lessonNav'),panel=document.getElementById('lessonPanel');
function render(){nav.innerHTML=lessons.map((l,i)=>`<button class="lesson-link ${state.current===i?'active':''}" data-lesson="${i}"><span class="lesson-num">${state.done.includes(i)?'✓':String(i+1).padStart(2,'0')}</span><span>${l.title}</span></button>`).join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{state.current=+b.dataset.lesson;render()});let l=lessons[state.current];panel.innerHTML=`<div class="lesson-head"><div><div class="kicker">LESSON ${String(state.current+1).padStart(2,'0')} · ${l.sub}</div><h2>${l.title}</h2><p>聖經希伯來文入門課程</p></div><button class="mark ${state.done.includes(state.current)?'done':''}" id="mark">${state.done.includes(state.current)?'✓ 已完成':'標記完成'}</button></div><p class="intro">${l.intro}</p><div class="letter-grid">${l.letters.map(x=>`<div class="letter"><div class="glyph" lang="he" dir="rtl">${x[0]}</div><div class="name">${x[1]}</div><div class="sound">${x[2]}</div><button class="hear" data-say="${x[3]}">🔊 聽發音</button></div>`).join('')}</div><div class="note-box"><span class="note-icon">✦</span><div>${l.note}</div></div><h3 class="section-title">小測驗</h3><div class="exercise"><p>${l.quiz.q}</p><div class="answers">${l.quiz.choices.map((x,i)=>`<button class="answer" data-answer="${i}">${x}</button>`).join('')}</div><div class="feedback" id="feedback" aria-live="polite">選一個答案試試看。</div></div><div class="lesson-foot"><button class="secondary" id="prev" ${state.current===0?'disabled':''}>← 上一課</button><small>發音後請跟著念；也可以使用裝置的語音輸入練習。</small><button class="primary" id="next">${state.current===lessons.length-1?'回到第一課':'下一課 →'}</button></div>`;
 panel.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>speak(b.dataset.say));panel.querySelector('#mark').onclick=()=>{if(!state.done.includes(state.current))state.done.push(state.current);localStorage.setItem('hebrewDone',JSON.stringify(state.done));render();toast('已記錄本課進度')};panel.querySelector('#prev').onclick=()=>{if(state.current>0){state.current--;render()}};panel.querySelector('#next').onclick=()=>{state.current=(state.current+1)%lessons.length;render()};panel.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{const ok=+b.dataset.answer===l.quiz.correct;panel.querySelectorAll('.answer').forEach(x=>x.disabled=true);b.classList.add(ok?'correct':'wrong');panel.querySelector('#feedback').textContent=ok?'答對了！可以繼續下一課。':'再想一想，看看字母或課文提示。';if(ok&&!state.done.includes(state.current)){state.done.push(state.current);localStorage.setItem('hebrewDone',JSON.stringify(state.done));updateProgress()}});updateProgress()}
function speak(text){if(!('speechSynthesis'in window)){toast('此瀏覽器不支援語音播放');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='he-IL';u.rate=.78;const voices=speechSynthesis.getVoices();const he=voices.find(v=>v.lang.toLowerCase().startsWith('he'));if(he)u.voice=he;else toast('裝置沒有希伯來文語音，將以可用語音嘗試播放');speechSynthesis.speak(u)}
function updateProgress(){const n=state.done.length;document.getElementById('progressText').textContent=`${n} / ${lessons.length}`;document.getElementById('progressBar').style.width=`${n/lessons.length*100}%`;document.getElementById('progressHint').textContent=n===lessons.length?'太好了！已完成目前所有課程':n?`已完成 ${n} 課，繼續保持`:'完成一課，開始累積進度'}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2500)}
render();
</script>
</body>
</html>
